[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "repo-health-check"
version = "0.1.0"
description = "A dependency-free CLI for checking open-source repository readiness."
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "Hossam Galal" }]

[project.scripts]
repo-health = "repo_health.cli:main"
